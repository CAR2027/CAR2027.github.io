<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monotonía de una Función</title>
    <style>
        :root {
            --creciente: #10B981; /* Verde */
            --decreciente: #EF4444; /* Rojo */
            --constante: #F59E0B; /* Naranja/Amarillo */
            --bg: #F8FAFC;
            --panel: #FFFFFF;
            --text: #1E293B;
            --border: #E2E8F0;
            --primary: #3B82F6;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            background: var(--panel);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        .visual-panel {
            flex: 1 1 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        canvas {
            width: 100%;
            background-color: #FAFAFA;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: crosshair;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        input[type="range"] {
            flex: 1;
            cursor: pointer;
        }
        
        .control-panel {
            flex: 1 1 300px;
            background: var(--bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h2 { margin-top: 0; color: var(--primary); font-size: 1.4em; }
        
        select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 1em;
            cursor: pointer;
            outline: none;
            font-weight: bold;
        }

        .status-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid gray;
            transition: border-color 0.3s;
        }
        .status-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .math-text {
            font-family: monospace;
            font-size: 1.1em;
            background: #F1F5F9;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            margin: 10px 0;
        }
        
        .legend {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .legend span { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            h2 { font-size: 1.2em; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="visual-panel">
        <div class="legend">
            <span><div class="dot" style="background: var(--creciente);"></div> Creciente</span>
            <span><div class="dot" style="background: var(--decreciente);"></div> Decreciente</span>
            <span><div class="dot" style="background: var(--constante);"></div> Punto Crítico</span>
        </div>
        
        <!-- Canvas para la gráfica -->
        <canvas id="mathCanvas" width="600" height="400"></canvas>
        
        <!-- Control deslizante del punto X -->
        <div class="slider-container">
            <b>x = <span id="x-val-display">0.00</span></b>
            <input type="range" id="x-slider" min="-3" max="3" step="0.05" value="0">
        </div>
    </div>

    <div class="control-panel">
        <h2>Análisis de Monotonía</h2>
        <p style="font-size: 0.9em; color: #64748B;">
            La monotonía estudia si una función va hacia "arriba" o hacia "abajo". 
            Mueve el punto en la gráfica para ver la recta tangente (la derivada).
        </p>
        
        <label style="font-weight:bold;">1. Elige una función:</label>
        <select id="func-select">
            <option value="cuadratica">f(x) = x² (Parábola)</option>
            <option value="cubica">f(x) = x³ - 3x (Cúbica)</option>
            <option value="seno">f(x) = 3·sen(x) (Onda)</option>
        </select>

        <hr style="width: 100%; border: 0; border-top: 1px solid var(--border);">

        <label style="font-weight:bold;">2. Análisis en tiempo real:</label>
        <div id="status-box" class="status-box">
            <div id="status-title" class="status-title">
                <div id="status-dot" class="dot" style="background: gray;"></div>
                <span id="status-text">Analizando...</span>
            </div>
            
            <div class="math-text">
                Pendiente (f') = <span id="m-val">0.00</span>
            </div>
            
            <p id="status-desc" style="font-size: 0.95em; color: #475569; margin-bottom: 0;">
                Mueve el deslizador para comenzar el análisis.
            </p>
        </div>
    </div>
</div>

<script>
    // --- LÓGICA MATEMÁTICA ---
    const funciones = {
        cuadratica: {
            f: (x) => x * x,
            df: (x) => 2 * x, 
            rangoX: [-3, 3], rangoY: [-2, 9]
        },
        cubica: {
            f: (x) => Math.pow(x, 3) - 3 * x,
            df: (x) => 3 * x * x - 3,
            rangoX: [-3, 3], rangoY: [-5, 5]
        },
        seno: {
            f: (x) => 3 * Math.sin(x),
            df: (x) => 3 * Math.cos(x),
            rangoX: [-5, 5], rangoY: [-5, 5]
        }
    };

    let funcionActual = 'cuadratica';
    let currentX = 0;

    // --- ELEMENTOS DEL DOM ---
    const canvas = document.getElementById('mathCanvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('x-slider');
    const selectFunc = document.getElementById('func-select');
    const displayX = document.getElementById('x-val-display');
    const displayM = document.getElementById('m-val');
    
    // Panel de estado
    const statusBox = document.getElementById('status-box');
    const statusText = document.getElementById('status-text');
    const statusDesc = document.getElementById('status-desc');
    const statusDot = document.getElementById('status-dot');

    // --- SISTEMA DE COORDENADAS ---
    function mapX(x, rX) {
        return (x - rX[0]) / (rX[1] - rX[0]) * canvas.width;
    }
    function mapY(y, rY) {
        // Invertimos Y porque en canvas Y crece hacia abajo
        return canvas.height - ((y - rY[0]) / (rY[1] - rY[0]) * canvas.height);
    }

    // --- DIBUJO ---
    function draw() {
        const funcData = funciones[funcionActual];
        const rX = funcData.rangoX;
        const rY = funcData.rangoY;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Dibujar Cuadrícula y Ejes
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#E2E8F0';
        for(let i = Math.ceil(rX[0]); i <= Math.floor(rX[1]); i++) {
            let px = mapX(i, rX);
            ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, canvas.height); ctx.stroke();
        }
        for(let i = Math.ceil(rY[0]); i <= Math.floor(rY[1]); i++) {
            let py = mapY(i, rY);
            ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(canvas.width, py); ctx.stroke();
        }

        ctx.strokeStyle = '#94A3B8';
        ctx.lineWidth = 2;
        let yZero = mapY(0, rY);
        let xZero = mapX(0, rX);
        // Eje X
        ctx.beginPath(); ctx.moveTo(0, yZero); ctx.lineTo(canvas.width, yZero); ctx.stroke();
        // Eje Y
        ctx.beginPath(); ctx.moveTo(xZero, 0); ctx.lineTo(xZero, canvas.height); ctx.stroke();

        // Dibujar la curva coloreada según la monotonía (derivada)
        ctx.lineWidth = 4;
        let prevPx = mapX(rX[0], rX);
        let prevPy = mapY(funcData.f(rX[0]), rY);
        
        let step = (rX[1] - rX[0]) / 300; // Resolución de la curva

        for (let x = rX[0] + step; x <= rX[1]; x += step) {
            let y = funcData.f(x);
            let df = funcData.df(x);
            let px = mapX(x, rX);
            let py = mapY(y, rY);

            ctx.beginPath();
            ctx.moveTo(prevPx, prevPy);
            ctx.lineTo(px, py);

            // Elegir color según el signo de la derivada
            if (df > 0.1) ctx.strokeStyle = '#10B981'; // Creciente
            else if (df < -0.1) ctx.strokeStyle = '#EF4444'; // Decreciente
            else ctx.strokeStyle = '#F59E0B'; // Punto crítico / Constante
            
            ctx.stroke();
            prevPx = px;
            prevPy = py;
        }

        // --- Dibujar el punto actual y su recta tangente ---
        let yActual = funcData.f(currentX);
        let mActual = funcData.df(currentX);
        let pxActual = mapX(currentX, rX);
        let pyActual = mapY(yActual, rY);

        // Recta tangente (y - y1 = m(x - x1) => y = m(x - x1) + y1)
        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#334155';
        ctx.setLineDash([5, 5]);
        
        let xTan1 = currentX - 1.5;
        let yTan1 = mActual * (xTan1 - currentX) + yActual;
        let xTan2 = currentX + 1.5;
        let yTan2 = mActual * (xTan2 - currentX) + yActual;
        
        ctx.moveTo(mapX(xTan1, rX), mapY(yTan1, rY));
        ctx.lineTo(mapX(xTan2, rX), mapY(yTan2, rY));
        ctx.stroke();
        ctx.setLineDash([]);

        // Punto
        ctx.beginPath();
        ctx.arc(pxActual, pyActual, 7, 0, Math.PI * 2);
        
        // Actualizar UI
        displayX.innerText = currentX.toFixed(2);
        displayM.innerText = mActual.toFixed(2);
        
        if (mActual > 0.05) {
            ctx.fillStyle = '#10B981';
            statusBox.style.borderLeftColor = '#10B981';
            statusDot.style.background = '#10B981';
            statusText.innerText = "Función Estrictamente Creciente";
            statusDesc.innerHTML = "La pendiente de la recta tangente (derivada) es <b>Positiva</b>. Esto significa que a medida que avanzas a la derecha, la gráfica sube.";
        } else if (mActual < -0.05) {
            ctx.fillStyle = '#EF4444';
            statusBox.style.borderLeftColor = '#EF4444';
            statusDot.style.background = '#EF4444';
            statusText.innerText = "Función Estrictamente Decreciente";
            statusDesc.innerHTML = "La pendiente de la recta tangente (derivada) es <b>Negativa</b>. Esto significa que a medida que avanzas a la derecha, la gráfica baja.";
        } else {
            ctx.fillStyle = '#F59E0B';
            statusBox.style.borderLeftColor = '#F59E0B';
            statusDot.style.background = '#F59E0B';
            statusText.innerText = "Punto Crítico (Ni crece ni decrece)";
            statusDesc.innerHTML = "La pendiente es <b>Cero</b>. La recta tangente es completamente horizontal. Aquí la función alcanza un máximo, un mínimo, o un punto de inflexión.";
        }
        
        ctx.fill();
        ctx.stroke();
    }

    // --- EVENTOS ---
    slider.addEventListener('input', (e) => {
        currentX = parseFloat(e.target.value);
        draw();
    });

    selectFunc.addEventListener('change', (e) => {
        funcionActual = e.target.value;
        let funcData = funciones[funcionActual];
        // Ajustar el slider al nuevo dominio de la función
        slider.min = funcData.rangoX[0];
        slider.max = funcData.rangoX[1];
        
        // Si el valor actual está fuera de rango, centrarlo
        if(currentX < slider.min || currentX > slider.max) {
            currentX = (funcData.rangoX[0] + funcData.rangoX[1]) / 2;
            slider.value = currentX;
        }
        draw();
    });

    // Interacción táctil/mouse directo en el Canvas
    let isDragging = false;
    
    function updateFromCanvas(evt) {
        const rect = canvas.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const mouseX = clientX - rect.left;
        
        const funcData = funciones[funcionActual];
        // Mapeo inverso de Canvas X a Coordenada Lógica X
        let logicX = (mouseX / canvas.offsetWidth) * (funcData.rangoX[1] - funcData.rangoX[0]) + funcData.rangoX[0];
        
        // Limitar dentro del rango
        logicX = Math.max(funcData.rangoX[0], Math.min(funcData.rangoX[1], logicX));
        
        currentX = logicX;
        slider.value = currentX;
        draw();
    }

    canvas.addEventListener('mousedown', () => { isDragging = true; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', (e) => {
        if(isDragging) updateFromCanvas(e);
    });
    
    canvas.addEventListener('touchstart', (e) => { isDragging = true; updateFromCanvas(e); }, {passive: false});
    window.addEventListener('touchend', () => { isDragging = false; });
    window.addEventListener('touchmove', (e) => {
        if(isDragging) {
            e.preventDefault(); // Evitar scroll al arrastrar
            updateFromCanvas(e);
        }
    }, {passive: false});

    // Inicializar
    draw();
</script>
</body>
</html>
